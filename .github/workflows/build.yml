name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 크로스 빌드하지 않는다. 네이티브 애드온(better-sqlite3)과 동봉 바이너리가 플랫폼에 묶여 있다.
# 검증 빌드만 하고 릴리스에는 올리지 않는다 — 릴리스는 서명 인증서가 있는 장비에서 `pnpm run release:mac`으로 만든다
# (.claude/skills/meeting-stt-dev/references/distribution.md 6·8절)
jobs:
  build:
    name: macOS (arm64)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # 버전은 package.json의 packageManager를 따른다. 여기서 version을 함께 주면 액션이 충돌로 실패한다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 린트·타입·테스트
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm test

      # 이 단계가 실패하면 resources/bin이 비어 패키징해도 실행되지 않는다
      - name: 동봉 바이너리 준비
        run: pnpm tsx scripts/setupBin.ts --from-source

      # 서명하지 않는다 (릴리스는 로컬에서 만든다). 빈 CSC_LINK를 넘기면 electron-builder가
      # 그것을 인증서 경로로 읽어 "not a file"로 죽으므로 아예 주지 않는다.
      # electron-builder는 CI에서 태그를 보면 기본으로 게시하려 하므로 --publish never로 막는다
      - name: 패키징
        run: |
          pnpm run build
          pnpm exec electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: meeting-stt-macOS
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7
