name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 크로스 빌드하지 않는다. 네이티브 애드온(better-sqlite3)과 동봉 바이너리가 플랫폼마다 다르다
# (.claude/skills/meeting-stt-dev/references/distribution.md)
jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (arm64)
            os: macos-15
            setup: pnpm tsx scripts/setupBin.ts --from-source
            build: pnpm run build:mac
          - label: Windows (x64)
            os: windows-latest
            setup: pnpm tsx scripts/setupBin.ts
            build: pnpm run build:win

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 린트·타입·테스트
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm test

      # 이 단계가 실패하면 resources/bin이 비어 패키징해도 실행되지 않는다
      - name: 동봉 바이너리 준비
        run: ${{ matrix.setup }}

      - name: 패키징
        run: ${{ matrix.build }}
        env:
          # 시크릿이 없는 포크 PR에서는 서명 없이 빌드가 지나간다
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: meeting-stt-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    # 태그를 밀었을 때만 릴리스에 올린다
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
